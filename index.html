<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auckland Public Speaking</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* ── Type — one voice, Theinhardt, carried by weight ────────────────────
       Black/Bold = stage moments (questions, names, timers)
       Medium/Regular = chrome. (Canela faces kept below for reference only) */

    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Thin-Trial.otf') format('opentype');
      font-weight: 100; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-ThinItalic-Trial.otf') format('opentype');
      font-weight: 100; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Light-Trial.otf') format('opentype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-LightItalic-Trial.otf') format('opentype');
      font-weight: 300; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Regular-Trial.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-RegularItalic-Trial.otf') format('opentype');
      font-weight: 400; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Medium-Trial.otf') format('opentype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-MediumItalic-Trial.otf') format('opentype');
      font-weight: 500; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Bold-Trial.otf') format('opentype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-BoldItalic-Trial.otf') format('opentype');
      font-weight: 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Black-Trial.otf') format('opentype');
      font-weight: 900; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-BlackItalic-Trial.otf') format('opentype');
      font-weight: 900; font-style: italic; font-display: swap;
    }

    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Light.otf') format('opentype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Regular.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Medium.otf') format('opentype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Bold.otf') format('opentype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/theinhardt-black-webfont.ttf') format('truetype');
      font-weight: 900; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root {
      width: 100%; height: 100%;
      background: #F6F1EA;
      font-family: 'Theinhardt', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    /* Keyframe animations used by screen components */
    @keyframes revealEnter {
      from { opacity: 0; transform: translateY(26px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseBig {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%       { opacity: 0.76; transform: scale(0.99); }
    }

    @keyframes firstTimerChipPulse {
      0%   { opacity: 0.35; }
      35%  { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes ftNamePulse {
      0%   { color: #2F4FD6; }
      55%  { color: #2F4FD6; }
      100% { color: inherit; }
    }

    /* Wheel “currently under pointer” readout — short crossfade each slice change */
    @keyframes spinNameSwap {
      0% {
        opacity: 0;
        transform: translateY(0.2em) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Draw screen — soft pulse on red “full speed” hold state */
    @keyframes spinHoldPulse {
      0%, 100% { opacity: 0.72; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.02); }
    }

    /* Next Speaker reveal — warm spotlight bloom + rising gold dust */
    @keyframes revealGlowPulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.05); }
    }

    @keyframes revealRingPulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50%       { opacity: 0.75; transform: scale(1.04); }
    }

    @keyframes dustRise0 {
      0%   { transform: translate(0, 40px); opacity: 0; }
      18%  { opacity: 0.85; }
      100% { transform: translate(-34px, -300px); opacity: 0; }
    }

    @keyframes dustRise1 {
      0%   { transform: translate(0, 30px); opacity: 0; }
      18%  { opacity: 0.7; }
      100% { transform: translate(40px, -340px); opacity: 0; }
    }

    @keyframes dustRise2 {
      0%   { transform: translate(0, 48px); opacity: 0; }
      20%  { opacity: 0.6; }
      100% { transform: translate(-12px, -260px); opacity: 0; }
    }

    @keyframes revealRule {
      from { opacity: 0; transform: scaleX(0.3); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @keyframes revealQuoteIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes yoloPulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.04); }
    }

    @keyframes yoloTeasePulse {
      0%, 100% { opacity: 0.45; transform: translateY(0); }
      50%       { opacity: 1;   transform: translateY(-3px); }
    }

    @keyframes yoloQuestionReveal {
      0%   { opacity: 0; transform: scale(0.9) translateY(22px); }
      55%  { opacity: 0.72; transform: scale(0.97) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes yoloCountPop {
      0%   { opacity: 0; transform: scale(0.72); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes walkthroughHighlightPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 4px rgba(233,79,46,0.25), 0 0 22px rgba(233,79,46,0.3); }
      50%       { opacity: 0.88; box-shadow: 0 0 0 8px rgba(233,79,46,0.12), 0 0 34px rgba(233,79,46,0.42); }
    }

    @keyframes walkthroughShake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-8px); }
      40%, 60% { transform: translateX(8px); }
    }

    @keyframes walkthroughArrowNudge {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(7px); }
    }

    @keyframes walkthroughCoachPop {
      0%   { transform: scale(0.94); }
      55%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Candle draw — idle flame wobble, storm-gutter, smoke, winner bloom */
    @keyframes candleFlicker {
      0%, 100% { transform: scaleY(1) scaleX(1) rotate(0deg); }
      22%       { transform: scaleY(1.07) scaleX(0.95) rotate(-1.6deg); }
      41%       { transform: scaleY(0.93) scaleX(1.06) rotate(1.3deg); }
      62%       { transform: scaleY(1.05) scaleX(0.96) rotate(-0.9deg); }
      81%       { transform: scaleY(0.96) scaleX(1.03) rotate(1.7deg); }
    }

    @keyframes candleFlickerHard {
      0%, 100% { transform: scaleY(0.95) scaleX(1.04) rotate(-3deg); }
      16%       { transform: scaleY(1.12) scaleX(0.9) rotate(4.2deg); }
      32%       { transform: scaleY(0.82) scaleX(1.1) rotate(-5.2deg); }
      47%       { transform: scaleY(1.08) scaleX(0.94) rotate(2.6deg); }
      63%       { transform: scaleY(0.88) scaleX(1.07) rotate(-4.4deg); }
      82%       { transform: scaleY(1.03) scaleX(0.96) rotate(3.6deg); }
    }

    @keyframes candleSmoke {
      0%   { opacity: 0; transform: translate(0, 2px) scale(0.5) rotate(0deg); }
      14%  { opacity: 0.55; }
      100% { opacity: 0; transform: translate(30px, -110px) scale(1.7) rotate(26deg); }
    }

    @keyframes candleGlowPulse {
      0%, 100% { opacity: 0.82; }
      50%       { opacity: 1; }
    }

    /* Classic wheel — needle tick as each name passes the top */
    @keyframes wheelPointerDip {
      0%   { transform: translateX(-50%) translateY(0); }
      45%  { transform: translateX(-50%) translateY(3.5px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    /* The hat — roll-call drop-ins, shake, slip glimpses, winner toss */
    @keyframes hatShake {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      20%       { transform: rotate(-3.4deg) translate(-4px, 1px); }
      40%       { transform: rotate(2.8deg) translate(4px, -2px); }
      60%       { transform: rotate(-2.4deg) translate(-3px, 2px); }
      80%       { transform: rotate(3.2deg) translate(3px, 0); }
    }

    @keyframes hatFlick {
      0%   { transform: rotate(0deg) translateY(0); }
      28%  { transform: rotate(-7deg) translateY(-7px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    @keyframes hatDropIn {
      0%   { transform: translate(var(--sx), -46vh) rotate(var(--r0)); opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(0, 0) rotate(var(--r1)); opacity: 0; }
    }

    @keyframes hatSlipToss {
      0%   { transform: translate(0, 0) rotate(0deg) scale(0.9); opacity: 0; }
      14%  { opacity: 1; }
      55%  { transform: translate(calc(var(--dx) * 0.7), var(--peak)) rotate(var(--rot)) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), 6px) rotate(calc(var(--rot) * 1.7)) scale(0.85); opacity: 0; }
    }

    @keyframes hatWinnerToss {
      0%   { transform: translateY(26vh) rotate(-22deg) scale(0.72); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translateY(0) rotate(7deg) scale(1); opacity: 1; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(43,28,16,0.35); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Data must load before components -->
  <script src="data.js"></script>
  <script src="reveal-quotes.js"></script>
  <script src="jazz-loop.js"></script>
  <script type="text/babel" src="wheel.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="candles.jsx"></script>
  <script type="text/babel" src="classic-wheel.jsx"></script>
  <script type="text/babel" src="lottery.jsx"></script>
  <script type="text/babel" src="plinko.jsx"></script>
  <script type="text/babel" src="tophat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
