<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auckland Public Speaking</title>
  <!-- React 18.3.1 + Babel standalone 7.29.0, vendored so the app runs with no internet.
       Integrity hashes are the originals from unpkg. -->
  <script src="vendor/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"></script>
  <script src="vendor/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
  <script src="vendor/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"></script>

  <style>
    /* ── Type — two voices (Paper: "aps typography style guide") ────────────
       Canela Deck Bold = the stage (prompts, names): open tracking, generous leading
       Theinhardt = chrome (labels, badges, timers, buttons, hints)
       Neue Montreal = the wordmark only */

    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Regular-Trial.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Medium-Trial.otf') format('opentype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-Bold-Trial.otf') format('opentype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Canela Deck';
      src: url('fonts/CanelaDeck-BoldItalic-Trial.otf') format('opentype');
      font-weight: 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Montreal';
      src: url('fonts/neue-montreal/NeueMontreal-Medium.otf') format('opentype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Montreal';
      src: url('fonts/neue-montreal/NeueMontreal-Bold.otf') format('opentype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Light.otf') format('opentype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Regular.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Medium.otf') format('opentype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/Theinhardt Bold.otf') format('opentype');
      font-weight: 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Theinhardt';
      src: url('fonts/theinhardt-black-webfont.ttf') format('truetype');
      font-weight: 900; font-style: normal; font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body, #root {
      width: 100%; height: 100%;
      background: #101114;
      font-family: 'Theinhardt', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    input::placeholder,
    textarea::placeholder {
      color: inherit;
      opacity: 0.38;
    }

    /* Keyframe animations used by screen components */
    @keyframes revealEnter {
      from { opacity: 0; transform: translateY(26px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseBig {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%       { opacity: 0.76; transform: scale(0.99); }
    }

    @keyframes firstTimerChipPulse {
      0%   { opacity: 0.35; }
      35%  { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes ftNamePulse {
      0%   { color: #2F4FD6; }
      55%  { color: #2F4FD6; }
      100% { color: inherit; }
    }

    /* Next Speaker reveal — warm spotlight bloom + rising gold dust */
    @keyframes revealGlowPulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.05); }
    }

    @keyframes revealRingPulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50%       { opacity: 0.75; transform: scale(1.04); }
    }

    @keyframes dustRise0 {
      0%   { transform: translate(0, 40px); opacity: 0; }
      18%  { opacity: 0.85; }
      100% { transform: translate(-34px, -300px); opacity: 0; }
    }

    @keyframes dustRise1 {
      0%   { transform: translate(0, 30px); opacity: 0; }
      18%  { opacity: 0.7; }
      100% { transform: translate(40px, -340px); opacity: 0; }
    }

    @keyframes dustRise2 {
      0%   { transform: translate(0, 48px); opacity: 0; }
      20%  { opacity: 0.6; }
      100% { transform: translate(-12px, -260px); opacity: 0; }
    }

    @keyframes revealRule {
      from { opacity: 0; transform: scaleX(0.3); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @keyframes revealQuoteIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Yolo — one slow breath */
    @keyframes yoloPulse {
      0%, 100% { opacity: 0.82; transform: scale(1); }
      50%       { opacity: 1;    transform: scale(1.035); }
    }

    @keyframes yoloBreathe {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.85; }
    }

    @keyframes yoloQuestionReveal {
      0%   { opacity: 0; transform: scale(0.9) translateY(22px); }
      55%  { opacity: 0.72; transform: scale(0.97) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes walkthroughHighlightPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 4px rgba(233,79,46,0.25), 0 0 22px rgba(233,79,46,0.3); }
      50%       { opacity: 0.88; box-shadow: 0 0 0 8px rgba(233,79,46,0.12), 0 0 34px rgba(233,79,46,0.42); }
    }

    @keyframes walkthroughShake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-8px); }
      40%, 60% { transform: translateX(8px); }
    }

    @keyframes walkthroughArrowNudge {
      0%, 100% { transform: translateX(0); }
      50%      { transform: translateX(7px); }
    }

    @keyframes walkthroughCoachPop {
      0%   { transform: scale(0.94); }
      55%  { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* The hat — roll-call drop-ins, shake, slip glimpses, winner toss */
    /* smooth side-to-side rock with a slight lift at each end of the swing */
    @keyframes hatShake {
      0%   { transform: rotate(0deg) translate(0, 0); }
      25%  { transform: rotate(-3.2deg) translate(-6px, -3px); }
      50%  { transform: rotate(0deg) translate(0, 1px); }
      75%  { transform: rotate(3.2deg) translate(6px, -3px); }
      100% { transform: rotate(0deg) translate(0, 0); }
    }

    @keyframes hatGlowPulse {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 1; }
    }

    @keyframes hatFlick {
      0%   { transform: rotate(0deg) translateY(0); }
      28%  { transform: rotate(-7deg) translateY(-7px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    @keyframes hatDropIn {
      0%   { transform: translate(var(--sx), -46vh) rotate(var(--r0)); opacity: 0; }
      10%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(0, 0) rotate(var(--r1)); opacity: 0; }
    }

    @keyframes hatSlipToss {
      0%   { transform: translate(0, 0) rotate(0deg) scale(0.85); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(calc(var(--dx) * 0.75), var(--peak)) rotate(var(--rot)) scale(1.06); opacity: 1; }
      62%  { transform: translate(calc(var(--dx) * 0.82), calc(var(--peak) + 14px)) rotate(calc(var(--rot) * 1.15)) scale(1.06); opacity: 1; }
      100% { transform: translate(calc(var(--dx) * 0.35), 12px) rotate(calc(var(--rot) * 1.9)) scale(0.8); opacity: 0; }
    }

    @keyframes hatWinnerToss {
      0%   { transform: translateY(24vh) rotate(-38deg) scale(0.6); opacity: 0; }
      12%  { opacity: 1; }
      62%  { transform: translateY(-2vh) rotate(9deg) scale(1.02); }
      100% { transform: translateY(0) rotate(-2deg) scale(1); opacity: 1; }
    }

    @keyframes hatPacketFidget {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      30%       { transform: rotate(1.6deg) translateY(-2px); }
      70%       { transform: rotate(-1.4deg) translateY(1px); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(205,228,254,0.25); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Data must load before components -->
  <script src="data.js"></script>
  <script src="reveal-quotes.js"></script>
  <script src="jazz-loop.js"></script>
  <script src="qrcode.js"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="tophat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
